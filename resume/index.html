<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume</title>
    <link rel="stylesheet" href="../style/styles.css" />
  </head>
  <body>
    <header class="header" role="banner">
      <div class="container header__bar">
        <a class="brand title" href="../">John Uzoka</a>
        <nav class="nav" aria-label="Main">
          <a class="nav__link" href="../portfolio/">Portfolio</a>
          <a class="nav__link" href="../resume/">Resume</a>
          <a class="nav__link" href="../contact/">Contact</a>
        </nav>
        <nav class="social" aria-label="Social">
          <a class="social__link" href="https://github.com/JohnUzoka" target="_blank" rel="noopener">GitHub</a>
          <a class="social__link" href="https://www.linkedin.com/in/johnuzoka/" target="_blank" rel="noopener">LinkedIn</a>
        </nav>
      </div>
    </header>

    <main class="container resume-page" role="main" aria-label="Resume content">
      <section class="resume-page__intro">
        <h1 class="section-title">Resume</h1>
        <p class="section-desc">View my resume below or download the PDF directly.</p>
        <a class="resume-page__download" href="../assets/JohnUzoka_Resume.pdf" target="_blank" rel="noopener">Open PDF</a>
      </section>

      <section class="resume-page__viewer" aria-label="Resume PDF preview">
        <object data="../assets/JohnUzoka_Resume.pdf" type="application/pdf" class="resume-page__embed">
          <p>Your browser cannot display the resume preview. <a href="../assets/JohnUzoka_Resume.pdf">Download the PDF</a>.</p>
        </object>
      </section>
    </main>
  </body>
  
</html>
