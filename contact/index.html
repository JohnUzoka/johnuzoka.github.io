<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact</title>
    <link rel="stylesheet" href="../style/styles.css" />
  </head>
  <body>
    <header class="header" role="banner">
      <div class="container header__bar">
        <a class="brand title" href="../">John Uzoka</a>
        <nav class="nav" aria-label="Main">
          <a class="nav__link" href="../portfolio/">Portfolio</a>
          <a class="nav__link" href="../contact/">Contact</a>
        </nav>
        <nav class="social" aria-label="Social">
          <a class="social__link" href="https://github.com/JohnUzoka" target="_blank" rel="noopener">GitHub</a>
          <a class="social__link" href="https://www.linkedin.com/in/johnuzoka/" target="_blank" rel="noopener">LinkedIn</a>
        </nav>
      </div>
    </header>

    <main class="container home" role="main" aria-label="Contact content">
      <section class="home__intro">
        <h1 class="section-title">Contact</h1>
        <p class="section-desc">Feel free to reach out by email or connect with me on LinkedIn.</p>
      </section>

      <section class="home__profile" aria-label="Contact links">
        <article class="home__profile-card">
          <p class="home__profile-label">Email</p>
          <p class="home__profile-text">
            <a class="project-detail__back" href="mailto:johnuportfolio@gmail.com">Email me</a>
          </p>
        </article>

        <article class="home__profile-card">
          <p class="home__profile-label">LinkedIn</p>
          <p class="home__profile-text">
            <a class="project-detail__back" href="https://www.linkedin.com/in/johnuzoka/" target="_blank" rel="noopener">View LinkedIn profile</a>
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
